# Vhost Apache du builder APK.
# Déposé dans /etc/apache2/sites-available/__SERVER_NAME__.conf
# Le pendant HTTPS (-le-ssl.conf) est généré par `certbot --apache`, comme pour
# les vhosts supabase.* et odysseus.* déjà en place sur cette machine.
#
# Deux applications derrière une seule origine :
#   /api, /dl, /latest, /healthz, /webhook  →  API Express (9100)
#   tout le reste                           →  interface Next.js (3000)
#
# L'origine unique n'est pas un détail de confort : le cookie de session est en
# SameSite=Lax, il ne partirait donc pas vers une autre origine. C'est aussi ce
# qui rend toute configuration CORS inutile en production.

<VirtualHost *:80>
    ServerName __SERVER_NAME__
    DocumentRoot /var/www/html

    ProxyRequests Off
    ProxyPreserveHost On
    # Un APK de 150 Mo sur une connexion lente dépasse largement le défaut de 60 s.
    ProxyTimeout 600

    # Le dépôt d'un magasin de clés passe par ici. 8 Mo laissent de la marge
    # tout en écartant les corps de requête aberrants.
    LimitRequestBody 8388608

    # mod_proxy pose X-Forwarded-For et X-Forwarded-Host, mais PAS
    # X-Forwarded-Proto : sans cette ligne, les applications en amont croient
    # parler en clair et fabriquent des liens en http. `expr=%{REQUEST_SCHEME}`
    # donne la bonne valeur dans les deux vhosts, sans avoir à les différencier.
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}

    Header always set X-Robots-Tag "noindex, nofollow"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    # « same-origin » et non « no-referrer » : cette dernière pousse le
    # navigateur à envoyer « Origin: null » sur les POST de nos propres
    # formulaires. La confidentialité vis-à-vis des sites externes est
    # identique, sans casser la navigation interne.
    Header always set Referrer-Policy "same-origin"

    # Laissé à Apache : certbot dépose ici son challenge de renouvellement.
    ProxyPass /.well-known/ !

    # L'ordre compte : ces règles passent devant, la dernière capture tout le reste.
    ProxyPass        /api      http://127.0.0.1:9100/api
    ProxyPassReverse /api      http://127.0.0.1:9100/api
    ProxyPass        /dl       http://127.0.0.1:9100/dl
    ProxyPassReverse /dl       http://127.0.0.1:9100/dl
    ProxyPass        /latest   http://127.0.0.1:9100/latest
    ProxyPassReverse /latest   http://127.0.0.1:9100/latest
    ProxyPass        /healthz  http://127.0.0.1:9100/healthz
    ProxyPassReverse /healthz  http://127.0.0.1:9100/healthz

    # Ancienne route de webhook, conservée le temps que les hooks déjà posés
    # chez les clients migrent vers /api/webhooks/<espace>. Le journal du
    # service trace chaque appel qui l'emprunte encore.
    ProxyPass        /webhook  http://127.0.0.1:9100/webhook
    ProxyPassReverse /webhook  http://127.0.0.1:9100/webhook

    ProxyPass        /         http://127.0.0.1:3000/
    ProxyPassReverse /         http://127.0.0.1:3000/

    ErrorLog  ${APACHE_LOG_DIR}/apkbuild.error.log
    CustomLog ${APACHE_LOG_DIR}/apkbuild.access.log combined
</VirtualHost>
