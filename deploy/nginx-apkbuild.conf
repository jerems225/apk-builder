# Vhost nginx du builder APK — repli si nginx sert le trafic à la place
# d'Apache. Déposé dans /etc/nginx/conf.d/apkbuild.conf : n'interfère ni avec
# le site `default` ni avec les autres services de la machine.
#
# Le bloc TLS est ajouté automatiquement par certbot lors de l'installation.
#
# Même principe que le vhost Apache : une seule origine publique, l'API et les
# téléchargements devant, l'interface Next.js en capture finale. L'origine
# unique n'est pas un confort — le cookie de session est en SameSite=Lax, il ne
# partirait pas vers une autre origine.

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    # Le dépôt d'un magasin de clés passe par ici. Le plafond par défaut (1 Mo)
    # conviendrait, mais une marge évite un 413 incompréhensible côté interface.
    client_max_body_size 8m;

    access_log /var/log/nginx/apkbuild.access.log;
    error_log  /var/log/nginx/apkbuild.error.log;

    # Aucun APK ni journal de build ne doit finir dans un index de moteur.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Téléchargement des APK : fichiers de 30 à 150 Mo.
    # proxy_buffering off évite que nginx recopie tout le fichier sur disque
    # avant de commencer à l'envoyer au client.
    location ~ ^/(dl|latest)/ {
        proxy_pass http://127.0.0.1:9100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # API, documentation, webhooks, sonde de santé.
    location ~ ^/(api|healthz|webhook)(/|$) {
        proxy_pass http://127.0.0.1:9100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Tout le reste : l'interface Next.js.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 120s;
    }
}
